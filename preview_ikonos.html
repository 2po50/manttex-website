<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <title>Ikonų pavyzdys</title>
  <style>
    body { font-family: Arial, sans-serif; background: #F5F5F4; padding: 40px; color: #1C1917; }
    h1 { font-size: 22px; margin-bottom: 4px; }
    p { color: #666; margin-bottom: 32px; font-size: 14px; }
    h2 { font-size: 15px; color: #555; margin: 40px 0 16px; border-bottom: 1px solid #ddd; padding-bottom: 8px; }
    .grid { display: flex; flex-wrap: wrap; gap: 28px; }
    .icon-item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .icon-circle {
      width: 88px; height: 88px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .icon-circle svg { width: 48px; height: 48px; }
    .icon-label { font-size: 12px; color: #444; text-align: center; max-width: 88px; line-height: 1.4; font-weight: 500; }
    .dark  { background: #292524; }
    .navy  { background: #1C3B6E; }
    .orange { background: #C2852A; }
    .divider { height: 1px; background: #ddd; margin: 48px 0; }
  </style>
</head>
<body>

<h1>ManttеX — ikonų pavyzdys</h1>
<p>Trys spalvų variantai. Pasirink kurį nori naudoti svetainėje.</p>

<!-- ===== VARIANTAS 1: TAMSUS ===== -->
<h2>Variantas 1 — Tamsus (#292524, ManttеX spalva)</h2>
<div class="grid" id="dark-grid"></div>

<div class="divider"></div>

<!-- ===== VARIANTAS 2: TAMSIAI MĖLYNAS ===== -->
<h2>Variantas 2 — Tamsiai mėlynas (#1C3B6E, kaip pavyzdyje)</h2>
<div class="grid" id="navy-grid"></div>

<div class="divider"></div>

function renderGrid(containerId, colorClass) {
  const grid = document.getElementById(containerId);
  icons.forEach(icon => {
    const item = document.createElement('div');
    item.className = 'icon-item';
    item.innerHTML = `
      <div class="icon-circle ${colorClass}">${icon.svg}</div>
      <div class="icon-label">${icon.label}</div>
    `;
    grid.appendChild(item);
  });
}

renderGrid('navy-grid', 'navy');
renderGrid('orange-grid', 'orange');
